<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="綠波通勤">
<title>綠波通勤</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- 出發 -->
  <section class="view" id="v-plan">
    <header class="bar">
      <div><div class="eyebrow">MT15 · 永和 ⇄ 松江路</div><h1>綠波通勤</h1></div>
      <div class="seg" role="group" aria-label="方向">
        <button id="dAm" aria-pressed="true">上班</button><button id="dPm" aria-pressed="false">下班</button>
      </div>
    </header>
    <div class="card hero" id="planHero"></div>
    <div class="list" id="planRoutes"></div>
    <p class="note" id="liveNote"></p>
    <button class="big go" id="startBtn">開始導航</button>
    <p class="note">騎乘時請把手機固定在手機架上，不要手持操作。導航會保持螢幕亮著，並每秒記錄 GPS。</p>
  </section>

  <!-- 騎乘 -->
  <section class="view ride" id="v-ride" hidden>
    <div class="ride-top">
      <div class="clock num" id="rClock">--:--</div>
      <div class="eta" id="rEta">定位中…</div>
    </div>
    <div class="sig-card" id="rSig">
      <div class="sig-dist num" id="rSigDist">—</div>
      <div class="sig-name" id="rSigName">等待 GPS</div>
      <div class="sig-adv" id="rAdv"></div>
    </div>
    <div class="turn" id="rTurn"></div>
    <div class="ride-bottom">
      <div class="speed"><span class="num spd" id="rSpeed">0</span><small>km/h</small></div>
      <div class="ride-route" id="rRoute"></div>
    </div>
    <div class="ride-actions">
      <button class="big stamp" id="rStamp" disabled>綠燈亮</button>
      <button class="big ghost" id="rStop">結束</button>
    </div>
    <div class="gps-status" id="rGps"></div>
  </section>

  <!-- 號誌 -->
  <section class="view" id="v-sig" hidden>
    <header class="bar"><div><div class="eyebrow">自動學習 ＋ 手動登記</div><h1>號誌</h1></div>
      <div class="seg" role="group" aria-label="時段"><button id="sAm" aria-pressed="true">早上</button><button id="sPm" aria-pressed="false">傍晚</button></div></header>
    <p class="note">每次你在號誌前停下再起步，起步時刻就是一次「綠燈亮」的觀察。同一個路口累積 4 次以上，就會推算週期，騎乘時預測燈號。也可以手動登記。</p>
    <div class="list" id="sigList"></div>
    <div class="card" id="sigEdit" hidden></div>
  </section>

  <!-- 紀錄與設定 -->
  <section class="view" id="v-set" hidden>
    <header class="bar"><div><div class="eyebrow">資料只存在這支手機</div><h1>紀錄與設定</h1></div></header>
    <div class="card">
      <h2>家與公司</h2>
      <p class="note">站在家門口或公司門口時按下，用來判斷出發和抵達。位置只存在這支手機，不會上傳。</p>
      <div class="row"><button class="btn" id="setHome">把目前位置設為「家」</button><span class="small" id="homeVal"></span></div>
      <div class="row"><button class="btn" id="setOffice">把目前位置設為「公司」</button><span class="small" id="officeVal"></span></div>
    </div>
    <div class="card">
      <h2>通勤紀錄</h2>
      <div id="tripStats"></div>
      <div class="row wrap">
        <button class="btn" id="expGpx">匯出 GPX（給分析網頁）</button>
        <button class="btn" id="expJson">備份全部資料</button>
        <label class="btn" for="impFile">匯入（時間軸 / GPX / 備份）</label>
        <input type="file" id="impFile" accept=".json,.gpx,.kml,.csv" multiple hidden>
      </div>
      <p class="small" id="impMsg"></p>
      <div id="tripList"></div>
    </div>
    <div class="card">
      <h2>偏好</h2>
      <label class="row"><input type="checkbox" id="optVoice" checked> 語音提示</label>
      <label class="row"><input type="checkbox" id="optRecord" checked> 導航時記錄 GPS 軌跡</label>
      <div class="row wrap"><span class="small">上班要在幾點前到：</span><input type="time" id="optDeadline" value="09:00"></div>
      <div class="row wrap" id="clearBox"><button class="btn danger" id="clearAll">清除這支手機上的所有資料</button></div>
    </div>
  </section>

  <nav class="tabs" id="tabs">
    <button data-v="plan" aria-current="page">出發</button>
    <button data-v="sig">號誌</button>
    <button data-v="set">紀錄</button>
  </nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
